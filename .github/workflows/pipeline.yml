name: DevOps Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: article-service
            dockerfile: ArticleService/Dockerfile

          - name: article-database
            dockerfile: ArticleDatabase/Dockerfile

          - name: comment-service
            dockerfile: CommentService/Dockerfile

          - name: comment-database
            dockerfile: CommentDatabase/Dockerfile

          - name: draft-service
            dockerfile: DraftService/Dockerfile

          - name: draft-database
            dockerfile: DraftDatabase/Dockerfile

          - name: profanity-service
            dockerfile: ProfanityService/Dockerfile

          - name: profanity-database
            dockerfile: ProfanityDatabase/Dockerfile

          - name: publisher-service
            dockerfile: PublisherService/Dockerfile

          - name: newsletter-service
            dockerfile: NewsletterService/Dockerfile

          - name: article-cache
            dockerfile: ArticleCache/Dockerfile

          - name: comment-cache
            dockerfile: CommentCache/Dockerfile

          - name: article-queue
            dockerfile: ArticleQueue/Dockerfile

      steps:
       -  name: Login to Docker
          uses: docker/login-action@v4
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}
      
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v4
        - name: Generate Docker metadata
          id: meta
          uses: docker/metadata-action@v5
          with:
            images: ${{ secrets.DOCKER_USERNAME }}/happyheadlines
            tags: |
              type=semver,pattern=${{ matrix.name }}-{{version}}
              type=raw,value=${{ matrix.name }}-latest
            
        - name: Build and push Docker image
          uses: docker/build-push-action@v7
          with:
            context: .
            file: ${{ matrix.dockerfile }}
            push: true
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}