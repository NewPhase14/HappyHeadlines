services:
  africa-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: africa
    ports:
      - "5432:5432"
    volumes:
      - africa-db-data:/var/lib/postgresql
    
  europe-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: europe
    ports:
      - "5433:5432"
    volumes:
      - europe-db-data:/var/lib/postgresql
  
  asia-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: asia
    ports:
      - "5434:5432"
    volumes:
      - asia-db-data:/var/lib/postgresql
  
  north-america-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: north_america
    ports:
      - "5435:5432"
    volumes:
      - north-america-db-data:/var/lib/postgresql
    
  south-america-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: south_america
    ports:
      - "5436:5432"
    volumes:
      - south-america-db-data:/var/lib/postgresql
    
  antarctica-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: antarctica
    ports:
      - "5437:5432"
    volumes:
      - antarctica-db-data:/var/lib/postgresql
    
  oceania-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: oceania
    ports:
      - "5438:5432"
    volumes:
      - oceania-db-data:/var/lib/postgresql

  global-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: global
    ports:
      - "5439:5432"
    volumes:
      - global-db-data:/var/lib/postgresql
    
  comment-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: comment
    ports:
      - "5440:5432"
    volumes:
      - comment-db-data:/var/lib/postgresql
    
  profanity-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: profanity
    ports:
      - "5441:5432"
    volumes:
      - profanity-db-data:/var/lib/postgresql

  article-database:
    image: article-database:latest
    build:
      context: .
      dockerfile: ArticleDatabase/Dockerfile
    depends_on:
      - africa-db
      - europe-db
      - asia-db
      - north-america-db
      - south-america-db
      - antarctica-db
      - oceania-db
      - global-db
  
  article-service:
    image: article-service:latest
    build:
      context: .
      dockerfile: ArticleService/Dockerfile
    depends_on:
      - article-database
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AFRICA_DB_CONNECTION: "Host=africa-db;Port=5432;Database=africa;Username=admin;Password=admin"
      EUROPE_DB_CONNECTION: "Host=europe-db;Port=5432;Database=europe;Username=admin;Password=admin"
      ASIA_DB_CONNECTION: "Host=asia-db;Port=5432;Database=asia;Username=admin;Password=admin"
      NORTH_AMERICA_DB_CONNECTION: "Host=north-america-db;Port=5432;Database=north_america;Username=admin;Password=admin"
      SOUTH_AMERICA_DB_CONNECTION: "Host=south-america-db;Port=5432;Database=south_america;Username=admin;Password=admin"
      ANTARCTICA_DB_CONNECTION: "Host=antarctica-db;Port=5432;Database=antarctica;Username=admin;Password=admin"
      OCEANIA_DB_CONNECTION: "Host=oceania-db;Port=5432;Database=oceania;Username=admin;Password=admin"
      GLOBAL_DB_CONNECTION: "Host=global-db;Port=5432;Database=global;Username=admin;Password=admin"
    deploy:
      replicas: 3
    ports:
      - "5001:8080"
     
  profanity-database:
    image: profanity-database:latest
    build:
      context: .
      dockerfile: ProfanityDatabase/Dockerfile
    depends_on:
      - profanity-db

  profanity-service:
    image: profanity-service:latest
    build:
      context: .
      dockerfile: ProfanityService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      - profanity-database 
    ports:
      - "5002:8080"
     
  comment-database: 
    image: comment-database:latest
    build:
      context: .
      dockerfile: CommentDatabase/Dockerfile
    depends_on:
      - comment-db
    
  comment-service:
    image: comment-service:latest
    build:
      context: .
      dockerfile: CommentService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      - comment-database
      - profanity-service
    ports:
      - "5003:8080"
  
volumes:
    africa-db-data:
    europe-db-data:
    asia-db-data:
    north-america-db-data:
    south-america-db-data:
    antarctica-db-data:
    oceania-db-data:
    global-db-data:
    comment-db-data:
    profanity-db-data:
    