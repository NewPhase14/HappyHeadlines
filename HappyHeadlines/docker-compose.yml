services:
  africa-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: africa
    ports:
      - "5432:5432"
    volumes:
      - africa-db-data:/var/lib/postgresql
    
  europe-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: europe
    ports:
      - "5433:5432"
    volumes:
      - europe-db-data:/var/lib/postgresql
  
  asia-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: asia
    ports:
      - "5434:5432"
    volumes:
      - asia-db-data:/var/lib/postgresql
  
  north-america-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: north_america
    ports:
      - "5435:5432"
    volumes:
      - north-america-db-data:/var/lib/postgresql
    
  south-america-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: south_america
    ports:
      - "5436:5432"
    volumes:
      - south-america-db-data:/var/lib/postgresql
    
  antarctica-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: antarctica
    ports:
      - "5437:5432"
    volumes:
      - antarctica-db-data:/var/lib/postgresql
    
  oceania-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: oceania
    ports:
      - "5438:5432"
    volumes:
      - oceania-db-data:/var/lib/postgresql

  global-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: global
    ports:
      - "5439:5432"
    volumes:
      - global-db-data:/var/lib/postgresql
    
  comment-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: comment
    ports:
      - "5440:5432"
    volumes:
      - comment-db-data:/var/lib/postgresql
    
  profanity-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: profanity
    ports:
      - "5441:5432"
    volumes:
      - profanity-db-data:/var/lib/postgresql
  
  draft-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: draft
    ports:
      - "5442:5432"
    volumes:
      - draft-db-data:/var/lib/postgresql
    
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
  
  article-database:
    build:
      context: .
      dockerfile: ArticleDatabase/Dockerfile
    depends_on:
      - africa-db
      - europe-db
      - asia-db
      - north-america-db
      - south-america-db
      - antarctica-db
      - oceania-db
      - global-db
  
  article-service:
    build:
      context: .
      dockerfile: ArticleService/Dockerfile
    depends_on:
      - article-database
      - article-queue-rabbitmq
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AFRICA_DB_CONNECTION: "Host=africa-db;Port=5432;Database=africa;Username=admin;Password=admin"
      EUROPE_DB_CONNECTION: "Host=europe-db;Port=5432;Database=europe;Username=admin;Password=admin"
      ASIA_DB_CONNECTION: "Host=asia-db;Port=5432;Database=asia;Username=admin;Password=admin"
      NORTH_AMERICA_DB_CONNECTION: "Host=north-america-db;Port=5432;Database=north_america;Username=admin;Password=admin"
      SOUTH_AMERICA_DB_CONNECTION: "Host=south-america-db;Port=5432;Database=south_america;Username=admin;Password=admin"
      ANTARCTICA_DB_CONNECTION: "Host=antarctica-db;Port=5432;Database=antarctica;Username=admin;Password=admin"
      OCEANIA_DB_CONNECTION: "Host=oceania-db;Port=5432;Database=oceania;Username=admin;Password=admin"
      GLOBAL_DB_CONNECTION: "Host=global-db;Port=5432;Database=global;Username=admin;Password=admin"
      AppOptions__RABBITMQ_HOST: "host=article-queue-rabbitmq"
    deploy:
      replicas: 3
  
  article-service-dev:
    build:
      context: .
      dockerfile: ArticleService/Dockerfile
    depends_on:
      - article-database
      - article-queue-rabbitmq
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AFRICA_DB_CONNECTION: "Host=africa-db;Port=5432;Database=africa;Username=admin;Password=admin"
      EUROPE_DB_CONNECTION: "Host=europe-db;Port=5432;Database=europe;Username=admin;Password=admin"
      ASIA_DB_CONNECTION: "Host=asia-db;Port=5432;Database=asia;Username=admin;Password=admin"
      NORTH_AMERICA_DB_CONNECTION: "Host=north-america-db;Port=5432;Database=north_america;Username=admin;Password=admin"
      SOUTH_AMERICA_DB_CONNECTION: "Host=south-america-db;Port=5432;Database=south_america;Username=admin;Password=admin"
      ANTARCTICA_DB_CONNECTION: "Host=antarctica-db;Port=5432;Database=antarctica;Username=admin;Password=admin"
      OCEANIA_DB_CONNECTION: "Host=oceania-db;Port=5432;Database=oceania;Username=admin;Password=admin"
      GLOBAL_DB_CONNECTION: "Host=global-db;Port=5432;Database=global;Username=admin;Password=admin"
      AppOptions__RABBITMQ_HOST: "host=article-queue-rabbitmq"
    ports:
      - "5001:8080"
     
  profanity-database:
    build:
      context: .
      dockerfile: ProfanityDatabase/Dockerfile
    depends_on:
      - profanity-db

  profanity-service:
    build:
      context: .
      dockerfile: ProfanityService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      PROFANITY_DB_CONNECTION: "Host=profanity-db;Port=5432;Database=profanity;Username=admin;Password=admin"
    depends_on:
      - profanity-database 
    ports:
      - "5002:8080"
     
  comment-database: 
    build:
      context: .
      dockerfile: CommentDatabase/Dockerfile
    depends_on:
      - comment-db
    
  comment-service:
    build:
      context: .
      dockerfile: CommentService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      COMMENT_DB_CONNECTION: "Host=comment-db;Port=5432;Database=comment;Username=admin;Password=admin"
    depends_on:
      - comment-database
      - profanity-service
    ports:
      - "5003:8080"
  
  draft-database: 
    build:
      context: .
      dockerfile: DraftDatabase/Dockerfile
    depends_on:
      - draft-db
  
  draft-service: 
    build:
      context: .
      dockerfile: DraftService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DRAFT_DB_CONNECTION: "Host=draft-db;Port=5432;Database=draft;Username=admin;Password=admin"
    depends_on:
      - draft-database
    ports:
      - "5004:8080"
  
  publisher-service:
    build:
      context: .
      dockerfile: PublisherService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AppOptions__RABBITMQ_HOST: "host=article-queue-rabbitmq"
    ports:
      - "5005:8080"
    
  newsletter-service:
    build:
      context: .
      dockerfile: NewsletterService/Dockerfile
    depends_on:
      - article-queue-rabbitmq
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AppOptions__RABBITMQ_HOST: "host=article-queue-rabbitmq"
    ports:
      - "5006:8080"
    
  comment-cache-service:
    build:
      context: .
      dockerfile: CommentCache/Dockerfile
    depends_on:
      - redis
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      REDIS_CONNECTION: "redis:6379"
    ports:
      - "5007:8080"

  article-cache-service:
    build:
      context: .
      dockerfile: ArticleCache/Dockerfile
    depends_on:
      - redis
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      REDIS_CONNECTION: "redis:6379"
    ports:
      - "5008:8080"

  seq:
    image: datalust/seq
    ports:
      - "5341:5341"
      - "5342:80"
    volumes:
      - rps_seq_data:/data
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
      
  zipkin:
    image: openzipkin/zipkin
    ports:
      - "9411:9411"
  
  article-queue-rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  
  article-queue:
    build:
      context: .
      dockerfile: ArticleQueue/Dockerfile
    depends_on:
      - article-queue-rabbitmq
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AppOptions__RABBITMQ_HOST: "host=article-queue-rabbitmq"
    ports:
      - "8000:80"
  
volumes:
    africa-db-data:
    europe-db-data:
    asia-db-data:
    north-america-db-data:
    south-america-db-data:
    antarctica-db-data:
    oceania-db-data:
    global-db-data:
    comment-db-data:
    profanity-db-data:
    rps_seq_data:
    draft-db-data:
    redis-data:
    